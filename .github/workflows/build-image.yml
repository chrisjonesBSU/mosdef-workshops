name: Build workshop image

# Builds the workshop environment once and publishes it to GitHub Container
# Registry, so each Codespace pulls a finished image instead of re-running the
# conda solve and the pip installs from git.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - environment.yml
      - .github/workflows/build-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires the owner to be lowercase
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/mosdef-workshop:latest
            ghcr.io/${{ steps.owner.outputs.name }}/mosdef-workshop:${{ github.sha }}
